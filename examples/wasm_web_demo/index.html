<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZPE-Ink WASM Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --panel: #fffaf2;
      --ink: #17212b;
      --muted: #5c6876;
      --accent: #b35c2e;
      --border: #d8cdbd;
    }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f7f2e8 0%, #ece4d6 100%);
      color: var(--ink);
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(23, 33, 43, 0.08);
      padding: 20px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.03em;
    }
    p {
      line-height: 1.5;
      color: var(--muted);
    }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    button, input[type="file"] {
      font: inherit;
    }
    button {
      border: 0;
      background: var(--accent);
      color: white;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
    }
    input[type="file"] {
      padding: 8px 0;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #111820;
      color: #eaf2ff;
      padding: 16px;
      border-radius: 14px;
      min-height: 160px;
    }
    .note {
      font-size: 0.95rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <h1>ZPE-Ink WASM Demo</h1>
      <p>Browser-side decode demo. The default sample is synthetic and exists only to prove the repo wasm binding path.</p>
      <div class="row">
        <button id="load-sample" type="button">Load embedded sample</button>
        <input id="file-input" type="file" accept=".zpink,application/octet-stream">
      </div>
      <p class="note" id="status">WASM binding not loaded yet.</p>
      <pre id="output">Waiting for decode.</pre>
    </div>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
