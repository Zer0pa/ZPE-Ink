[build-system]
requires = ["setuptools>=68,<82", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "zpe-ink"
version = "0.1.1"
description = "ZPE Ink Wave-1 codec and falsification harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Zer0pa (Pty) Ltd", email = "architects@zer0pa.ai"}]
license = "LicenseRef-Zer0pa-SAL-7.0"
keywords = [
    "digital-ink",
    "stroke-codec",
    "pen-input",
    "cross-runtime",
    "wasm",
    "pyo3",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Development Status :: 3 - Alpha",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Zer0pa/ZPE-Ink"
Documentation = "https://github.com/Zer0pa/ZPE-Ink#readme"
Repository = "https://github.com/Zer0pa/ZPE-Ink"
Issues = "https://github.com/Zer0pa/ZPE-Ink/issues"
Changelog = "https://github.com/Zer0pa/ZPE-Ink/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2.2,<2",
    "pytest>=8,<10",
]
telemetry = [
    "comet-ml>=3.49,<4",
]

[project.scripts]
zpe-ink = "zpe_ink.cli:entrypoint"
zpe-ink-demo = "zpe_ink.cli:demo_entry"
zpe-ink-verify-roundtrip = "zpe_ink.cli:verify_roundtrip_entry"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
include = ["zpe_ink*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["code/tests"]
addopts = "-q"
